<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог моторов Hidea</title>
    <style>
        body { background-color: #111; font-family: system-ui, sans-serif; margin: 0; padding: 20px; color: #fff; }
        .navbar { background-color: #1a1a1a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; margin-bottom: 30px; }
        .navbar a { color: #fff; text-decoration: none; font-weight: bold; }
        .catalog-title { font-size: 2rem; font-weight: 300; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }
        .page-bucket { display: none; }
        .page-bucket.active { display: grid; }
        .product-card { background: #111; display: flex; flex-direction: column; padding: 15px; border-radius: 8px; }
        .img-container { text-align: center; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; background: #161616; border-radius: 6px; font-size: 3rem; }
        .motor-title { font-size: 1.1rem; font-weight: bold; margin: 0 0 5px 0; text-transform: uppercase; }
        .motor-cat { font-size: 0.8rem; color: #888; margin-bottom: 15px; }
        .btn-watch { background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; align-self: flex-start; }
        .btn-watch:hover { background: #e0e0e0; }
        .pagination-container { display: flex; justify-content: center; margin: 50px 0; }
        .pagination-btn { background: #222; border: 1px solid #333; padding: 10px 20px; margin: 0 6px; cursor: pointer; border-radius: 4px; color: #fff; font-weight: bold; }
        .pagination-btn.active { background: #ffc107; color: #000; border-color: #ffc107; }
        /* Модальное окно */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #1a1a1a; width: 90%; max-width: 500px; padding: 30px; border-radius: 12px; border: 1px solid #333; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; color: #888; cursor: pointer; background: none; border: none; }
        .modal-title { font-size: 1.5rem; font-weight: bold; color: #ffc107; text-transform: uppercase; }
        .modal-price { font-size: 1.3rem; font-weight: bold; color: #dc3545; margin: 10px 0; }
        .specs-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .specs-table th, .specs-table td { padding: 8px; text-align: left; border-bottom: 1px solid #333; font-size: 0.9rem; }
        .specs-table th { color: #888; font-weight: normal; width: 50%; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="../index.html">← НАЗАД НА САЙТ СТРЕЖЕНЬ</a>
        <span style="color:#ffc107; font-weight:bold;">⚓ ДЕМО-КАТАЛОГ</span>
    </div>

    <div class="container">
        <div class="catalog-title">Каталог</div>

        <!-- СТРАНИЦА 1 -->
        <div class="products-grid page-bucket active" id="content-page-1">
            <div class="product-card">
                <div class="img-container">⚓</div>
                <h6 class="motor-title">HD 3</h6><div class="motor-cat">2-х тактные моторы</div>
                <button class="btn-watch" onclick="openSpecs('HD 3', '2-х тактные моторы', 'Цена по запросу', {'Мощность': '3.0 л.с.', 'Тип': '2-х тактный', 'Объем': '50 куб.см', 'Вес': '9.8 кг'})">Смотреть</button>
            </div>
            <div class="product-card">
                <div class="img-container">⚓</div>
                <h6 class="motor-title">HD 5</h6><div class="motor-cat">2-х тактные моторы</div>
                <button class="btn-watch" onclick="openSpecs('HD 5', '2-х тактные моторы', 'Цена по запросу', {'Мощность': '5.0 л.с.', 'Тип': '2-х тактный', 'Объем': '102 куб.см', 'Вес': '20 кг'})">Смотреть</button>
            </div>
            <div class="product-card">
                <div class="img-container">⚓</div>
                <h6 class="motor-title">HD 9.9</h6><div class="motor-cat">2-х тактные моторы</div>
                <button class="btn-watch" onclick="openSpecs('HD 9.9', '2-х тактные моторы', 'Цена по запросу', {'Мощность': '9.9 л.с.', 'Тип': '2-х тактный', 'Объем': '246 куб.см', 'Вес': '36 кг'})">Смотреть</button>
            </div>
        </div>

        <!-- СТРАНИЦА 2 -->
        <div class="products-grid page-bucket" id="content-page-2">
            <div class="product-card">
                <div class="img-container">⚓</div>
                <h6 class="motor-title">HDF 3.5</h6><div class="motor-cat">4-х тактные моторы</div>
                <button class="btn-watch" onclick="openSpecs('HDF 3.5', '4-х тактные моторы', 'Цена по запросу', {'Мощность': '3.5 л.с.', 'Тип': '4-х тактный', 'Объем': '85 куб.см', 'Вес': '17 кг'})">Смотреть</button>
            </div>
            <div class="product-card">
                <div class="img-container">⚓</div>
                <h6 class="motor-title">HD 30 FES-EFI</h6><div class="motor-cat">Моторы EFI</div>
                <button class="btn-watch" onclick="openSpecs('HD 30 FES-EFI', 'Моторы EFI', 'Цена по запросу', {'Мощность': '30.0 л.с.', 'Тип': 'Инжекторный EFI', 'Объем': '496 куб.см', 'Вес': '53 кг'})">Смотреть</button>
            </div>
        </div>

        <div class="pagination-container">
            <button class="pagination-btn active" id="nav-1" onclick="switchTab(1)">1</button>
            <button class="pagination-btn" id="nav-2" onclick="switchTab(2)">2</button>
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО -->
    <div class="modal-overlay" id="specs-modal" onclick="closeSpecs()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeSpecs()">&times;</button>
            <div id="m-category" style="font-size: 0.8rem; color: #888; text-transform: uppercase;"></div>
            <div class="modal-title" id="m-title"></div>
            <div class="modal-price" id="m-price"></div>
            <h5 style="margin: 20px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px;">Характеристики:</h5>
            <table class="specs-table"><tbody id="m-specs-body"></tbody></table>
        </div>
    </div>

    <script>
        function switchTab(p) {
            document.querySelectorAll('.page-bucket').forEach(el => el.classList.remove('active'));
            document.getElementById('content-page-' + p).classList.add('active');
            document.querySelectorAll('.pagination-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + p).classList.add('active');
        }
        function openSpecs(title, category, price, specsObj) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-category').innerText = category;
            document.getElementById('m-price').innerText = price;
            const tbody = document.getElementById('m-specs-body');
            tbody.innerHTML = '';
            for (const [key, value] of Object.entries(specsObj)) {
                tbody.innerHTML += `<tr><th>${key}</th><td>${value}</td></tr>`;
            }
            document.getElementById('specs-modal').classList.add('active');
        }
        function closeSpecs() {
            document.getElementById('specs-modal').classList.remove('active');
        }
    </script>
</body>
</html>
