name: Download Strezhen Directly
on:
  workflow_dispatch: # Запуск кнопкой вручную

permissions:
  contents: write

jobs:
  download_strezhen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scrape Strezhen Website
        run: |
          # 1. Скачиваем оригинальную структуру, стили и картинки сайта Стрежень
          wget --mirror --page-requisites --adjust-extension --convert-links --no-parent --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" https://strezhen-boat.ru/
          
          # 2. Распаковываем файлы в корень нашего репозитория
          mv strezhen-boat.ru/* . || true
          rm -rf strezhen-boat.ru

          # 3. Вживляем кнопку перехода к моторам Hidea в оригинальное меню сайта
          if [ -f index.html ]; then
            sed -i 's|<li><a href="\#contacts">Контакты</a></li>|<li><a href="\#contacts">Контакты</a></li><li><a href="/strezhen-hidea-demo/shop/index.html" style="color: #ffc107; font-weight: bold;">⚓ Моторы Hidea</a></li>|g' index.html
          fi

      - name: Commit and Save Files to Repository
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Оригинальный сайт Стрежень успешно скачан и сохранен в облако" || exit 0
          git push origin main
